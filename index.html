<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>野球デジタル作戦ボード PRO v3 (Complete Edition)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #090d16; color: #f8fafc; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ナビゲーションバー (ボタン高さ48px推進規格) */
    nav {
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; padding: 0 16px; height: 56px; align-items: center; gap: 8px; flex-shrink: 0; z-index: 40;
    }
    .nav-btn {
      background: transparent; color: #94a3b8; border: none; padding: 0 16px; height: 48px; font-size: 15px; font-weight: 600;
      cursor: pointer; border-radius: 10px; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .nav-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); }

    .page { display: none; flex: 1; height: calc(100vh - 56px); flex-direction: column; overflow: hidden; position: relative; }
    .page.active { display: flex; }

    /* ヘッダー */
    header {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px);
      padding: 6px 12px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 30; flex-shrink: 0; overflow-x: auto;
    }
    .header-tab-bar { display: flex; gap: 4px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 12px; }
    .header-tab {
      background: transparent; color: #94a3b8; border: none; padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer;
    }
    .header-tab.active { background: #0284c7; color: #fff; }
    .header-panel { display: none; align-items: center; gap: 8px; }
    .header-panel.active { display: flex; }

    /* Touch最適化ボタン (高さ48px対応) */
    .btn {
      background: rgba(30, 41, 59, 0.8); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.15);
      min-height: 48px; min-width: 48px; padding: 0 14px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .btn:active { transform: scale(0.95); }
    .btn.active { background: #0284c7; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
    .btn-danger { background: rgba(153, 27, 27, 0.85); border-color: rgba(239, 68, 68, 0.5); }
    .btn-success { background: rgba(22, 101, 52, 0.85); border-color: rgba(34, 197, 94, 0.5); }
    .btn-purple { background: rgba(126, 34, 206, 0.85); border-color: rgba(168, 85, 247, 0.5); }
    .btn-sm { min-height: 36px; min-width: 36px; padding: 0 10px; font-size: 12px; border-radius: 8px; }

    /* カラーピッカー（黒・紫を追加） */
    .color-picker { display: flex; align-items: center; gap: 6px; padding: 0 6px; }
    .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.selected { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 8px rgba(255,255,255,0.6); }

    /* AI作戦バッジ提案エリア */
    .ai-suggestion-bar {
      position: absolute; top: 60px; left: 16px; z-index: 25; display: flex; align-items: center; gap: 8px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); padding: 8px 14px; border-radius: 14px; border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .ai-badge { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; }
    .ai-chip { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .ai-chip:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }

    /* スコアボード */
    .scoreboard-overlay {
      position: absolute; top: 60px; right: 16px; z-index: 25;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 8px 12px;
      display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .score-ctrl-group { display: flex; flex-direction: column; align-items: center; }
    .score-title { font-size: 10px; color: #94a3b8; font-weight: bold; margin-bottom: 2px; }
    .score-row { display: flex; align-items: center; gap: 4px; }
    .score-val { font-size: 18px; font-weight: 800; color: #38bdf8; min-width: 20px; text-align: center; }

    .out-dots { display: flex; gap: 4px; }
    .out-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); }
    .out-dot.o-active { background: #ef4444; border-color: #f87171; box-shadow: 0 0 6px #ef4444; }

    /* グラウンド */
    #field-container { flex: 1; position: relative; width: 100%; height: 100%; background: #040914; overflow: hidden; touch-action: none; }
    svg { width: 100%; height: 100%; display: block; transform-origin: 0 0; }

    .zoom-controls {
      position: absolute; bottom: 20px; left: 20px; z-index: 25; display: flex; gap: 6px; align-items: center;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); padding: 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    }

    .field-bottom-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 25;
      display: flex; gap: 8px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      padding: 6px 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Bottom Sheet（メモ領域拡張） */
    .bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; height: 80vh;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px 20px 0 0; z-index: 100; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; padding: 0 20px 20px 20px;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 5px; background: rgba(255, 255, 255, 0.3); border-radius: 3px; margin: 10px auto 14px auto; cursor: pointer; }
    .sheet-content { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 340px 1fr; gap: 20px; }

    /* ライブラリ */
    .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding-top: 8px; }
    .play-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; cursor: pointer; }
    .play-card img { width: 100%; height: 100px; object-fit: cover; background: #040914; }
    .play-card-body { padding: 8px; }
    .play-card-title { font-size: 13px; font-weight: bold; color: #f8fafc; margin-bottom: 2px; }
    .play-card-actions { display: flex; gap: 4px; margin-top: 6px; }

    /* サブページ */
    .container-page { flex: 1; padding: 20px; overflow-y: auto; max-width: 1000px; margin: 0 auto; width: 100%; }
    .card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border-radius: 14px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 16px; }
    .card h3 { font-size: 15px; color: #38bdf8; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left; }
    th { color: #94a3b8; background: rgba(15, 23, 42, 0.4); }
    select, input[type="text"] { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; }

    /* Drag & Drop 行スタイル */
    tr.draggable-row { cursor: grab; }
    tr.draggable-row.dragging { opacity: 0.4; background: rgba(56, 189, 248, 0.2); }

    /* 監督用1枚シート PDF印刷 */
    @media print {
      body * { visibility: hidden; }
      #pdf-director-sheet, #pdf-director-sheet * { visibility: visible; }
      #pdf-director-sheet { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; color: #000; background: #fff; font-family: sans-serif; }
      .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
      .pdf-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 6px; font-size: 12px; text-align: center; color: #000; }
      .pdf-board-img { width: 100%; border: 1px solid #000; border-radius: 4px; }
    }
  </style>
</head>
<body>

<nav>
  <button class="nav-btn active" onclick="switchPage('board-page', this)">⚾ 作戦ボード</button>
  <button class="nav-btn" onclick="switchPage('lineup-page', this)">📋 スタメン・ドラッグ打順</button>
  <button class="nav-btn" onclick="switchPage('roster-page', this)">👤 選手検索・管理</button>
</nav>

<!-- 画面1：作戦ボード -->
<div class="page active" id="board-page">
  <header>
    <div class="header-tab-bar">
      <button class="header-tab active" onclick="switchHeaderPanel('panel-draw', this)">✏️ 描画</button>
      <button class="header-tab" onclick="switchHeaderPanel('panel-players', this)">🏃 選手</button>
      <button class="header-tab" onclick="switchHeaderPanel('panel-game', this)">⚙️ 管理</button>
    </div>

    <!-- 描画ツール -->
    <div class="header-panel active" id="panel-draw">
      <button class="btn active" id="tool-select" onclick="BoardModule.setTool('select')">✋ 移動</button>
      <button class="btn" id="tool-pen" onclick="BoardModule.setTool('pen')">✏️ ペン</button>
      <button class="btn" id="tool-laser" onclick="BoardModule.setTool('laser')">🚨 ポインター</button>
      <button class="btn" id="tool-eraser" onclick="BoardModule.setTool('eraser')">🧹 消しゴム</button>
      <!-- カラー選択（黒・紫を追加） -->
      <div class="color-picker">
        <div class="color-dot selected" style="background:#ffffff" onclick="BoardModule.setColor('#ffffff', this)"></div>
        <div class="color-dot" style="background:#ef4444" onclick="BoardModule.setColor('#ef4444', this)"></div>
        <div class="color-dot" style="background:#3b82f6" onclick="BoardModule.setColor('#3b82f6', this)"></div>
        <div class="color-dot" style="background:#eab308" onclick="BoardModule.setColor('#eab308', this)"></div>
        <div class="color-dot" style="background:#a855f7" onclick="BoardModule.setColor('#a855f7', this)"></div>
        <div class="color-dot" style="background:#0f172a" onclick="BoardModule.setColor('#0f172a', this)"></div>
      </div>
      <button class="btn btn-purple" onclick="BoardModule.playAnimation()">▶ タイムライン再生</button>
    </div>

    <!-- 選手操作 -->
    <div class="header-panel" id="panel-players">
      <button class="btn" onclick="BoardModule.addRunner()">🏃 走者+</button>
      <button class="btn" onclick="BoardModule.removeRunner()">❌ 走者-</button>
      <button class="btn" id="btn-toggle-label" onclick="BoardModule.toggleLabelMode()">🔢 表示切替</button>
    </div>

    <!-- 管理ツール（全体Global Undo/Redo対応） -->
    <div class="header-panel" id="panel-game">
      <button class="btn" onclick="AppUndoManager.undo()">↩️ 全Undo</button>
      <button class="btn" onclick="AppUndoManager.redo()">↪️ 全Redo</button>
      <button class="btn btn-success" onclick="toggleBottomSheet()">💾 保存/ライブラリ</button>
      <button class="btn" onclick="DataModule.exportJSON()">📤 JSON出力</button>
      <label class="btn" style="cursor:pointer;">📥 JSON入力<input type="file" accept=".json" onchange="DataModule.importJSON(event)" style="display:none;"></label>
      <button class="btn btn-purple" onclick="DataModule.showQRCode()">📱 QRコード共有</button>
      <button class="btn btn-danger" onclick="BoardModule.resetBoard()">🔄 リセット</button>
    </div>
  </header>

  <!-- AI作戦自動提案バー -->
  <div class="ai-suggestion-bar">
    <span class="ai-badge">AI提案</span>
    <div id="ai-suggestions" style="display:flex; gap:6px;"></div>
  </div>

  <!-- スコアボード（NEXT -> 次の回） -->
  <div class="scoreboard-overlay">
    <div class="score-ctrl-group">
      <span class="score-title">イニング</span>
      <div class="score-row">
        <button class="btn btn-sm" onclick="ScoreModule.advanceInning()">次の回</button>
        <span class="score-val" id="disp-inning">1表</span>
      </div>
    </div>
    <div class="score-ctrl-group">
      <span class="score-title">自チーム</span>
      <div class="score-row">
        <button class="btn btn-sm" onclick="ScoreModule.addScore('my', -1)">-</button>
        <span class="score-val" id="disp-score-my">0</span>
        <button class="btn btn-sm" onclick="ScoreModule.addScore('my', 1)">+</button>
      </div>
    </div>
    <div class="score-ctrl-group">
      <span class="score-title">相手</span>
      <div class="score-row">
        <button class="btn btn-sm" onclick="ScoreModule.addScore('opp', -1)">-</button>
        <span class="score-val" id="disp-score-opp">0</span>
        <button class="btn btn-sm" onclick="ScoreModule.addScore('opp', 1)">+</button>
      </div>
    </div>
    <div class="score-ctrl-group">
      <span class="score-title">OUT</span>
      <div class="score-row" style="cursor:pointer; padding:4px;" onclick="ScoreModule.stepOut()">
        <div class="out-dots">
          <div class="out-dot" id="o-1"></div>
          <div class="out-dot" id="o-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- グラウンド -->
  <div id="field-container" ondblclick="BoardModule.resetZoom()">
    <svg id="svgField" viewBox="0 0 1200 1300" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grass-stripe" width="1200" height="100" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="1200" height="50" fill="#15803d"/>
          <rect x="0" y="50" width="1200" height="50" fill="#166534"/>
        </pattern>
        <marker id="arrow-throw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
        <marker id="arrow-run" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
        <marker id="arrow-hit" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308"/></marker>
        <marker id="arrow-field" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
      </defs>
      <g id="viewport">
        <path d="M 100 980 L 100 450 A 700 700 0 0 1 1100 450 L 1100 980 Z" fill="url(#grass-stripe)" />
        <path d="M 85 990 L 85 430 A 725 725 0 0 1 1115 430 L 1115 990" fill="none" stroke="#334155" stroke-width="14" />
        <path d="M 90 990 L 90 435 A 720 720 0 0 1 1110 435 L 1110 990" fill="none" stroke="#f59e0b" stroke-width="4" />
        <polygon points="600,950 840,710 600,470 360,710" fill="url(#grass-stripe)" />
        <line x1="600" y1="980" x2="90" y2="435" stroke="#ffffff" stroke-width="4" />
        <line x1="600" y1="980" x2="1110" y2="435" stroke="#ffffff" stroke-width="4" />
        <circle cx="600" cy="710" r="36" fill="#b45309" />
        <rect x="588" y="704" width="24" height="10" fill="#ffffff" rx="2" />
        <polygon points="585,970 615,970 615,985 600,1000 585,985" fill="#ffffff" />
        <rect x="828" y="698" width="24" height="24" fill="#ffffff" transform="rotate(45 840 710)" />
        <rect x="588" y="458" width="24" height="24" fill="#ffffff" transform="rotate(45 600 470)" />
        <rect x="348" y="698" width="24" height="24" fill="#ffffff" transform="rotate(45 360 710)" />
        <g id="linesLayer"></g>
        <g id="objectsLayer"></g>
      </g>
    </svg>
  </div>

  <!-- ズーム操作（Reset -> 100%統一） -->
  <div class="zoom-controls">
    <button class="btn btn-sm" onclick="BoardModule.zoomDelta(-0.2)">-</button>
    <span id="zoom-disp" style="font-size:12px; font-weight:bold; color:#94a3b8; min-width:45px; text-align:center;">100%</span>
    <button class="btn btn-sm" onclick="BoardModule.zoomDelta(0.2)">+</button>
    <button class="btn btn-sm" onclick="BoardModule.resetZoom()">100%</button>
  </div>

  <div class="field-bottom-bar">
    <div class="btn-group">
      <button class="btn active" id="line-type-throw" onclick="BoardModule.setLineType('throw')">🔴 送球（実線）</button>
      <button class="btn" id="line-type-run" onclick="BoardModule.setLineType('run')">🟢 走塁（長破線）</button>
      <button class="btn" id="line-type-hit" onclick="BoardModule.setLineType('hit')">🟡 打球（太線）</button>
      <button class="btn" id="line-type-field" onclick="BoardModule.setLineType('field')">🔵 守備（点線）</button>
    </div>
  </div>
</div>

<!-- 画面2：スタメン設定（Drag & Drop 打順並び替え対応） -->
<div class="page" id="lineup-page">
  <div class="container-page">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0; border:none;">📋 スターティングメンバー（ドラッグで打順変更可能）</h3>
        <button class="btn btn-success" onclick="DataModule.exportDirectorPDF()">🖨️ 監督用1枚シートPDF</button>
      </div>
      <table>
        <thead>
          <tr><th style="width:40px;">移動</th><th style="width:50px;">打順</th><th style="width:90px;">守備</th><th>選手選択</th><th style="width:80px;">投打</th><th style="width:60px;">学年</th><th>メモ</th></tr>
        </thead>
        <tbody id="lineup-table-body"></tbody>
      </table>
      <button class="btn btn-success" style="margin-top:12px; width:100%; justify-content:center;" onclick="LineupModule.applyToBoard()">盤面にスタメン反映</button>
    </div>
  </div>
</div>

<!-- 画面3：選手管理（背番号・名前・学年マルチ検索対応） -->
<div class="page" id="roster-page">
  <div class="container-page">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0; border:none;">👤 選手登録・マルチ検索</h3>
        <input type="text" id="roster-search" placeholder="🔍 背番号・名前・学年検索..." oninput="LineupModule.renderRoster()" style="width:220px;">
      </div>
      <div style="display:grid; grid-template-columns: 80px 1fr 120px 90px 100px; gap:8px; margin-bottom:12px;">
        <input type="text" id="new-p-num" placeholder="背番号">
        <input type="text" id="new-p-name" placeholder="選手名">
        <select id="new-p-throws"><option value="右投右打">右投右打</option><option value="右投左打">右投左打</option><option value="左投左打">左投左打</option></select>
        <select id="new-p-grade"><option value="3年">3年</option><option value="2年">2年</option><option value="1年">1年</option></select>
        <button class="btn btn-success" onclick="LineupModule.addRosterPlayer()">追加</button>
      </div>
      <table>
        <thead><tr><th>背番号</th><th>選手名</th><th>投打</th><th>学年</th><th>操作</th></tr></thead>
        <tbody id="roster-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Bottom Sheet (広々メモ領域) -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle" onclick="toggleBottomSheet()"></div>
  <div class="sheet-content">
    <div>
      <h3 style="color:#38bdf8; margin-bottom:10px;">💾 作戦指示の保存</h3>
      <input type="text" id="save-title" placeholder="作戦タイトル" style="width:100%; margin-bottom:8px;">
      <textarea id="save-memo" rows="8" placeholder="詳細メモ・指示内容（広々記載可能）" style="width:100%; background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.15); color:#fff; border-radius:8px; padding:10px; margin-bottom:12px; font-size:14px;"></textarea>
      <button class="btn btn-success" style="width:100%; justify-content:center;" onclick="LibraryModule.savePlay()">保存実行</button>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3 style="color:#38bdf8; margin:0;">📚 作戦ライブラリ</h3>
        <input type="text" id="search-library" placeholder="🔍 作戦検索..." oninput="LibraryModule.filter()" style="width:180px; height:36px;">
      </div>
      <div class="library-grid" id="saved-list"></div>
    </div>
  </div>
</div>

<!-- QRコードダイアログ -->
<div id="qrModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; justify-content:center; align-items:center;">
  <div class="card" style="background:#1e293b; text-align:center; padding:24px; max-width:320px;">

<!-- 監督用1枚シート PDF印刷レイアウト -->
<div id="pdf-director-sheet" style="display:none;">
  <h2 style="text-align:center; margin-bottom:4px;">野球作戦指示書 / オーダーシート</h2>
  <div style="text-align:right; font-size:12px; margin-bottom:10px;" id="pdf-date"></div>
  <div class="pdf-grid">
    <div>
      <h3>【グラウンド配置図】</h3>
      <img id="pdf-board-img" class="pdf-board-img" src="" alt="作戦図">
      <div style="margin-top:10px; font-size:12px; border:1px solid #000; padding:8px;" id="pdf-memo-box"></div>
    </div>
    <div>
      <h3>【スターティングメンバー】</h3>
      <table class="pdf-table">
        <thead><tr><th>打順</th><th>位置</th><th>背番号</th><th>選手名</th><th>投打</th></tr></thead>
        <tbody id="pdf-lineup-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  /* === 1. グローバルUndo/Redoマネージャー (AppUndoManager) === */
  const AppUndoManager = {
    stack: [], pointer: -1,
    pushState() {
      if (this.pointer < this.stack.length - 1) this.stack = this.stack.slice(0, this.pointer + 1);
      const snapshot = JSON.stringify({
        score: ScoreModule.state,
        board: { players: BoardModule.players, runners: BoardModule.runners, ball: BoardModule.ball, lines: BoardModule.lines },
        lineup: LineupModule.lineup,
        roster: LineupModule.roster
      });
      this.stack.push(snapshot);
      if (this.stack.length > 30) this.stack.shift();
      else this.pointer++;
    },
    undo() {
      if (this.pointer > 0) {
        this.pointer--;
        this.apply(JSON.parse(this.stack[this.pointer]));
      }
    },
    redo() {
      if (this.pointer < this.stack.length - 1) {
        this.pointer++;
        this.apply(JSON.parse(this.stack[this.pointer]));
      }
    },
    apply(st) {
      ScoreModule.state = st.score; ScoreModule.updateUI();
      BoardModule.players = st.board.players; BoardModule.runners = st.board.runners; BoardModule.ball = st.board.ball; BoardModule.lines = st.board.lines; BoardModule.render();
      LineupModule.lineup = st.lineup; LineupModule.roster = st.roster; LineupModule.renderLineup(); LineupModule.renderRoster();
    }
  };

  /* === 2. スコアモジュール (ScoreModule) === */
  const ScoreModule = {
    state: { inning: 1, isTop: true, my: 0, opp: 0, o: 0 },
    addScore(team, val) {
      AppUndoManager.pushState();
      this.state[team] = Math.max(0, this.state[team] + val);
      this.updateUI();
    },
    advanceInning() {
      AppUndoManager.pushState();
      if (this.state.isTop) this.state.isTop = false;
      else { this.state.isTop = true; this.state.inning++; }
      this.state.o = 0;
      this.updateUI();
    },
    stepOut() {
      AppUndoManager.pushState();
      this.state.o = (this.state.o + 1) % 3;
      this.updateUI();
    },
    updateUI() {
      document.getElementById('disp-inning').innerText = `${this.state.inning}${this.state.isTop ? '表' : '裏'}`;
      document.getElementById('disp-score-my').innerText = this.state.my;
      document.getElementById('disp-score-opp').innerText = this.state.opp;
      for (let i = 1; i <= 2; i++) {
        document.getElementById(`o-${i}`)?.classList.toggle('o-active', this.state.o >= i);
      }
      AIModule.updateSuggestions();
    }
  };

  /* === 3. AI作戦自動提案モジュール (AIModule) === */
  const AIModule = {
    updateSuggestions() {
      const runnerCount = BoardModule.runners.length;
      const suggestions = [];
      if (runnerCount === 0) suggestions.push('ヒッティング', 'セーフティバント', '外野深め警戒');
      else if (runnerCount === 1) suggestions.push('送りバント', 'エンドラン', '盗塁狙い', '牽制');
      else if (runnerCount === 2) suggestions.push('スクイズ', 'セーフティスクイズ', 'ダブルスチール');
      else if (runnerCount >= 3) suggestions.push('前進守備', '満塁策', '押し出し警戒');

      const el = document.getElementById('ai-suggestions');
      el.innerHTML = suggestions.map(s => `<span class="ai-chip" onclick="alert('作戦【${s}】をインプットしました')">${s}</span>`).join('');
    }
  };

  /* === 4. 作戦ボードモジュール (BoardModule) === */
  const BoardModule = {
    defaultPlayers: [
      { id: 'P', label: '投', num: '1', name: '投手太郎', x: 600, y: 740, color: '#ef4444' },
      { id: 'C', label: '捕', num: '2', name: '捕手次郎', x: 600, y: 1050, color: '#ef4444' },
      { id: '1B', label: '一', num: '3', name: '一塁三郎', x: 870, y: 670, color: '#ef4444' },
      { id: '2B', label: '二', num: '4', name: '二塁四郎', x: 730, y: 550, color: '#ef4444' },
      { id: '3B', label: '三', num: '5', name: '三塁五郎', x: 330, y: 670, color: '#ef4444' },
      { id: 'SS', label: '遊', num: '6', name: '遊撃六郎', x: 470, y: 550, color: '#ef4444' },
      { id: 'LF', label: '左', num: '7', name: '左外七郎', x: 280, y: 340, color: '#ef4444' },
      { id: 'CF', label: '中', num: '8', name: '中外八郎', x: 600, y: 260, color: '#ef4444' },
      { id: 'RF', label: '右', num: '9', name: '右外九郎', x: 920, y: 340, color: '#ef4444' },
      { id: 'BATTER', label: '打', num: '10', name: '打者十郎', x: 530, y: 980, color: '#3b82f6' }
    ],
    players: [], runners: [], lines: [],
    ball: { x: 600, y: 760 },
    tool: 'select', lineType: 'throw', color: '#ffffff', labelMode: 'label',
    zoomScale: 1.0, panX: 0, panY: 0,

    init() {
      this.players = JSON.parse(JSON.stringify(this.defaultPlayers));
      this.setupEvents();
      this.render();
      AppUndoManager.pushState();
    },
    setTool(t) {
      this.tool = t;
      document.querySelectorAll('#panel-draw .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tool-${t}`)?.classList.add('active');
    },
    setLineType(t) {
      this.lineType = t;
      document.querySelectorAll('.field-bottom-bar .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`line-type-${t}`)?.classList.add('active');
    },
    setColor(c, el) {
      this.color = c;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
    },
    toggleLabelMode() {
      this.labelMode = this.labelMode === 'label' ? 'num' : this.labelMode === 'num' ? 'name' : 'label';
      this.render();
    },
    addRunner() {
      if (this.runners.length >= 3) return;
      AppUndoManager.pushState();
      const idx = this.runners.length + 1;
      const pos = idx === 1 ? { x: 860, y: 730 } : idx === 2 ? { x: 600, y: 420 } : { x: 340, y: 730 };
      this.runners.push({ id: `R${idx}`, label: `走${idx}`, num: `R${idx}`, name: `走者${idx}`, x: pos.x, y: pos.y, color: '#eab308' });
      this.render();
      AIModule.updateSuggestions();
    },
    removeRunner() { AppUndoManager.pushState(); this.runners.pop(); this.render(); AIModule.updateSuggestions(); },
    resetBoard() {
      if (confirm('作戦盤を初期状態にリセットしますか？')) {
        AppUndoManager.pushState();
        this.players = JSON.parse(JSON.stringify(this.defaultPlayers));
        this.runners = []; this.lines = []; this.ball = { x: 600, y: 760 };
        this.render();
      }
    },
    zoomDelta(d) {
      this.zoomScale = Math.min(Math.max(this.zoomScale + d, 0.6), 2.5);
      this.applyTransform();
    },
    resetZoom() { this.zoomScale = 1.0; this.panX = 0; this.panY = 0; this.applyTransform(); },
    applyTransform() {
      document.getElementById('viewport').setAttribute('transform', `translate(${this.panX}, ${this.panY}) scale(${this.zoomScale})`);
      document.getElementById('zoom-disp').innerText = `${Math.round(this.zoomScale * 100)}%`;
    },

    /* タイムライン再生アニメーション */
    playAnimation() {
      const paths = document.querySelectorAll('#linesLayer path');
      paths.forEach(p => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset 2s ease-in-out';
        p.style.strokeDashoffset = '0';
      });
    },

    setupEvents() {
      const svg = document.getElementById('svgField');
      let isDragging = false, dragTarget = null, currentLine = null;

      const getPoint = (e) => {
        const rect = svg.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return {
          x: (((clientX - rect.left) / rect.width) * 1200 - this.panX) / this.zoomScale,
          y: (((clientY - rect.top) / rect.height) * 1300 - this.panY) / this.zoomScale
        };
      };

      svg.addEventListener('pointerdown', (e) => {
        const pt = getPoint(e);
        if (e.pointerType === 'pen' || this.tool === 'pen' || this.tool === 'laser') {
          AppUndoManager.pushState();
          isDragging = true;
          currentLine = { type: this.lineType, color: this.tool === 'laser' ? '#ff0033' : this.color, points: [pt] };
          this.lines.push(currentLine);
        }
      });

      svg.addEventListener('pointermove', (e) => {
        const pt = getPoint(e);
        if (isDragging && currentLine) {
          currentLine.points.push(pt);
          this.renderLines();
        } else if (dragTarget) {
          if (dragTarget === 'ball') { this.ball = pt; }
          else {
            const p = [...this.players, ...this.runners].find(x => x.id === dragTarget);
            if (p) { p.x = pt.x; p.y = pt.y; }
          }
          this.renderObjects();
        }
      });

      window.addEventListener('pointerup', () => { isDragging = false; dragTarget = null; currentLine = null; });
      this.startDragObj = (id) => { AppUndoManager.pushState(); dragTarget = id; };
    },

    render() { this.renderObjects(); this.renderLines(); },
    renderObjects() {
      const layer = document.getElementById('objectsLayer');
      layer.innerHTML = '';

      const ballG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      ballG.innerHTML = `<circle cx="${this.ball.x}" cy="${this.ball.y}" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" style="cursor:grab;"/>`;
      ballG.onpointerdown = (e) => { e.stopPropagation(); this.startDragObj('ball'); };
      layer.appendChild(ballG);

      [...this.players, ...this.runners].forEach(p => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        let text = p.label;
        if (this.labelMode === 'num') text = p.num || p.label;
        if (this.labelMode === 'name') text = p.name || p.label;

        g.innerHTML = `
          <circle cx="${p.x}" cy="${p.y}" r="30" fill="${p.color}" stroke="#ffffff" stroke-width="3" style="cursor:grab;"/>
          <text x="${p.x}" y="${p.y + 6}" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold" style="pointer-events:none;">${text}</text>
        `;
        g.onpointerdown = (e) => { e.stopPropagation(); this.startDragObj(p.id); };
        layer.appendChild(g);
      });
    },
    renderLines() {
      const layer = document.getElementById('linesLayer');
      layer.innerHTML = '';
      this.lines.forEach(l => {
        if (l.points.length < 2) return;
        const d = l.points.reduce((acc, p, i) => `${acc} ${i===0?'M':'L'} ${p.x} ${p.y}`, '');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('stroke', l.color);
        path.setAttribute('stroke-width', l.type === 'hit' ? '9' : '6');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-linecap', 'round');

        if (l.type === 'run') path.setAttribute('stroke-dasharray', '12,6');
        if (l.type === 'field') path.setAttribute('stroke-dasharray', '4,5');
        if (l.type) path.setAttribute('marker-end', `url(#arrow-${l.type})`);
        layer.appendChild(path);
      });
    }
  };

  /* === 5. スタメン＆Drag & Drop打順モジュール (LineupModule) === */
  const LineupModule = {
    roster: [
      { num: '1', name: '投手太郎', throws: '右投右打', grade: '3年' },
      { num: '2', name: '捕手次郎', throws: '右投右打', grade: '3年' },
      { num: '3', name: '一塁三郎', throws: '右投左打', grade: '2年' },
      { num: '4', name: '二塁四郎', throws: '右投右打', grade: '2年' },
      { num: '5', name: '三塁五郎', throws: '右投右打', grade: '3年' },
      { num: '6', name: '遊撃六郎', throws: '右投左打', grade: '1年' },
      { num: '7', name: '左外七郎', throws: '左投左打', grade: '2年' },
      { num: '8', name: '中外八郎', throws: '右投両打', grade: '3年' },
      { num: '9', name: '右外九郎', throws: '右投右打', grade: '1年' }
    ],
    lineup: [
      { order: 1, pos: '中', playerNum: '8', memo: '' },
      { order: 2, pos: '二', playerNum: '4', memo: '' },
      { order: 3, pos: '遊', playerNum: '6', memo: '' },
      { order: 4, pos: '三', playerNum: '5', memo: '' },
      { order: 5, pos: '一', playerNum: '3', memo: '' },
      { order: 6, pos: '左', playerNum: '7', memo: '' },
      { order: 7, pos: '右', playerNum: '9', memo: '' },
      { order: 8, pos: '捕', playerNum: '2', memo: '' },
      { order: 9, pos: '投', playerNum: '1', memo: '' }
    ],

    init() { this.renderRoster(); this.renderLineup(); },
    renderRoster() {
      const tbody = document.getElementById('roster-table-body');
      tbody.innerHTML = '';
      const kw = (document.getElementById('roster-search')?.value || '').toLowerCase();

      this.roster.filter(p => p.num.includes(kw) || p.name.toLowerCase().includes(kw) || p.grade.includes(kw)).forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>#${p.num}</td><td>${p.name}</td><td>${p.throws}</td><td>${p.grade}</td>
          <td><button class="btn btn-danger btn-sm" onclick="LineupModule.deleteRoster(${i})">削除</button></td>
        `;
        tbody.appendChild(tr);
      });
      this.renderLineup();
    },
    addRosterPlayer() {
      AppUndoManager.pushState();
      const num = document.getElementById('new-p-num').value.trim();
      const name = document.getElementById('new-p-name').value.trim();
      if (!num || !name) return alert('背番号と名前を入力してください');
      this.roster.push({ num, name, throws: document.getElementById('new-p-throws').value, grade: document.getElementById('new-p-grade').value });
      document.getElementById('new-p-num').value = ''; document.getElementById('new-p-name').value = '';
      this.renderRoster();
    },
    deleteRoster(i) {
      if (confirm('この選手を削除しますか？')) { AppUndoManager.pushState(); this.roster.splice(i, 1); this.renderRoster(); }
    },
    renderLineup() {
      const tbody = document.getElementById('lineup-table-body');
      tbody.innerHTML = '';
      const positions = ['投', '捕', '一', '二', '三', '遊', '左', '中', '右', 'DH'];

      let dragIndex = null;
      this.lineup.forEach((item, idx) => {
        item.order = idx + 1;
        const pObj = this.roster.find(r => r.num === item.playerNum) || {};
        const tr = document.createElement('tr');
        tr.className = 'draggable-row';
        tr.draggable = true;

        tr.ondragstart = () => { dragIndex = idx; tr.classList.add('dragging'); };
        tr.ondragover = (e) => e.preventDefault();
        tr.ondrop = () => {
          AppUndoManager.pushState();
          const dragged = this.lineup.splice(dragIndex, 1)[0];
          this.lineup.splice(idx, 0, dragged);
          this.renderLineup();
        };

        const posOpts = positions.map(p => `<option value="${p}" ${item.pos === p ? 'selected':''}>${p}</option>`).join('');
        const playerOpts = this.roster.map(p => `<option value="${p.num}" ${item.playerNum === p.num ? 'selected':''}>#${p.num} ${p.name}</option>`).join('');

        tr.innerHTML = `
          <td>☰</td>
          <td><b>${item.order}</b></td>
          <td><select onchange="LineupModule.lineup[${idx}].pos=this.value">${posOpts}</select></td>
          <td><select onchange="LineupModule.lineup[${idx}].playerNum=this.value; LineupModule.renderLineup();">${playerOpts}</select></td>
          <td>${pObj.throws || '-'}</td><td>${pObj.grade || '-'}</td>
          <td><input type="text" value="${item.memo}" oninput="LineupModule.lineup[${idx}].memo=this.value" style="width:100%;"></td>
        `;
        tbody.appendChild(tr);
      });
    },
    applyToBoard() {
      AppUndoManager.pushState();
      this.lineup.forEach(item => {
        const pObj = this.roster.find(r => r.num === item.playerNum);
        const fieldP = BoardModule.players.find(p => p.label === item.pos || p.id === item.pos);
        if (fieldP && pObj) { fieldP.num = pObj.num; fieldP.name = pObj.name; }
      });
      BoardModule.render();
      alert('スタメン情報を盤面に反映しました');
    }
  };

  /* === 6. ライブラリ機能 (LibraryModule) === */
  const LibraryModule = {
    savePlay() {
      const title = document.getElementById('save-title').value || '無題の作戦';
      const memo = document.getElementById('save-memo').value;
      const svg = document.getElementById('svgField');
      const svgData = new XMLSerializer().serializeToString(svg);

      const img = new Image();
      img.onload = () => {
        const cvs = document.createElement('canvas');
        cvs.width = 400; cvs.height = 433;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(img, 0, 0, 400, 433);
        const thumb = cvs.toDataURL('image/jpeg', 0.6);

        const saves = JSON.parse(localStorage.getItem('baseball_plays_v3') || '[]');
        saves.push({ id: Date.now(), title, memo, thumb, date: new Date().toLocaleDateString(), players: BoardModule.players, runners: BoardModule.runners, ball: BoardModule.ball, lines: BoardModule.lines });
        localStorage.setItem('baseball_plays_v3', JSON.stringify(saves));

        document.getElementById('save-title').value = ''; document.getElementById('save-memo').value = '';
        this.filter();
        alert('ライブラリへ保存完了');
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
    },
    filter() {
      const saves = JSON.parse(localStorage.getItem('baseball_plays_v3') || '[]');
      const kw = document.getElementById('search-library').value.toLowerCase();
      const list = document.getElementById('saved-list');
      list.innerHTML = '';

      saves.filter(s => s.title.toLowerCase().includes(kw)).forEach(s => {
        const card = document.createElement('div');
        card.className = 'play-card';
        card.innerHTML = `
          <img src="${s.thumb}" alt="thumb">
          <div class="play-card-body">
            <div class="play-card-title">${s.title}</div>
            <div style="font-size:10px; color:#94a3b8;">${s.date}</div>
            <div class="play-card-actions">
              <button class="btn btn-sm" onclick="LibraryModule.loadPlay(${s.id})">開く</button>
              <button class="btn btn-sm" onclick="LibraryModule.duplicatePlay(${s.id})">複製</button>
              <button class="btn btn-danger btn-sm" onclick="LibraryModule.deletePlay(${s.id})">削除</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    },
    loadPlay(id) {
      const saves = JSON.parse(localStorage.getItem('baseball_plays_v3') || '[]');
      const item = saves.find(s => s.id === id);
      if (item) {
        AppUndoManager.pushState();
        BoardModule.players = item.players; BoardModule.runners = item.runners || [];
        BoardModule.ball = item.ball; BoardModule.lines = item.lines || [];
        BoardModule.render();
        toggleBottomSheet();
      }
    },
    duplicatePlay(id) {
      const saves = JSON.parse(localStorage.getItem('baseball_plays_v3') || '[]');
      const item = saves.find(s => s.id === id);
      if (item) {
        saves.push({ ...item, id: Date.now(), title: item.title + ' (コピー)' });
        localStorage.setItem('baseball_plays_v3', JSON.stringify(saves));
        this.filter();
      }
    },
    deletePlay(id) {
      if (confirm('この作戦を削除しますか？')) {
        let saves = JSON.parse(localStorage.getItem('baseball_plays_v3') || '[]');
        saves = saves.filter(s => s.id !== id);
        localStorage.setItem('baseball_plays_v3', JSON.stringify(saves));
        this.filter();
      }
    }
  };

  /* === 7. データ管理＆QR＆PDFエクスポート (DataModule) === */
  const DataModule = {
    exportJSON() {
      const data = {
        score: ScoreModule.state, roster: LineupModule.roster, lineup: LineupModule.lineup,
        board: { players: BoardModule.players, runners: BoardModule.runners, ball: BoardModule.ball, lines: BoardModule.lines }
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `baseball_strategy_${Date.now()}.json`; a.click();
    },
    importJSON(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          if (confirm('データを復元しますか？')) {
            AppUndoManager.pushState();
            if (data.roster) LineupModule.roster = data.roster;
            if (data.lineup) LineupModule.lineup = data.lineup;
            if (data.board) { BoardModule.players = data.board.players; BoardModule.runners = data.board.runners; BoardModule.ball = data.board.ball; BoardModule.lines = data.board.lines; }
            LineupModule.renderRoster(); BoardModule.render();
            alert('データを正常に読み込みました');
          }
        } catch(err) { alert('不正なJSON形式です'); }
      };
      reader.readAsText(file);
    },
    showQRCode() {
      const stateStr = encodeURIComponent(JSON.stringify({ board: BoardModule.players, score: ScoreModule.state }));
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${stateStr}`;
      document.getElementById('qrImage').src = qrUrl;
      document.getElementById('qrModal').style.display = 'flex';
    },
    exportDirectorPDF() {
      document.getElementById('pdf-date').innerText = `作成日時: ${new Date().toLocaleString()}`;
      document.getElementById('pdf-memo-box').innerText = document.getElementById('save-memo').value || '指示事項なし';

      const tbody = document.getElementById('pdf-lineup-tbody');
      tbody.innerHTML = '';
      LineupModule.lineup.forEach(item => {
        const pObj = LineupModule.roster.find(r => r.num === item.playerNum) || {};
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${item.order}</td><td>${item.pos}</td><td>#${item.playerNum}</td><td>${pObj.name||''}</td><td>${pObj.throws||''}</td>`;
        tbody.appendChild(tr);
      });

      const svg = document.getElementById('svgField');
      const svgData = new XMLSerializer().serializeToString(svg);
      const img = new Image();
      img.onload = () => {
        const cvs = document.createElement('canvas'); cvs.width = 600; cvs.height = 650;
        cvs.getContext('2d').drawImage(img, 0, 0, 600, 650);
        document.getElementById('pdf-board-img').src = cvs.toDataURL('image/png');
        window.print();
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
    }
  };

  /* UI制御 */
  function switchPage(pageId, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav .nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    btn.classList.add('active');
  }

  function switchHeaderPanel(panelId, btn) {
    document.querySelectorAll('.header-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.header-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(panelId).classList.add('active');
    btn.classList.add('active');
  }

  function toggleBottomSheet() {
    document.getElementById('bottomSheet').classList.toggle('open');
    if (document.getElementById('bottomSheet').classList.contains('open')) LibraryModule.filter();
  }

  window.addEventListener('DOMContentLoaded', () => {
    ScoreModule.updateUI();
    BoardModule.init();
    LineupModule.init();
  });
</script>
</body>
</html>
